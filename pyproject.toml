[project]
name = "normshift"
version = "0.3.2"
description = "Evidence-backed semantic diff for technical standards (M0 core; M1/M2 experimental only)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "NormShift Contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "rapidfuzz>=3.0.0",
    "jsonschema>=4.0.0",
    "packaging>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "types-lxml>=2024.0.0",
]

[project.scripts]
normshift = "normshift.cli:app"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normshift"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "types-lxml>=2024.0.0",
    "cyclonedx-python-lib[validation]==11.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # Typer Argument/Option defaults are intentional
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["normshift"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "lxml.*", "jsonschema.*"]
ignore_missing_imports = true
