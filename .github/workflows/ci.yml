name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-gates:
    name: deterministic-gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Keep environments and caches outside the checkout
        shell: pwsh
        run: |
          $externalState = @{
            UV_PROJECT_ENVIRONMENT = Join-Path $env:RUNNER_TEMP "normshift-project-env"
            UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "uv-cache"
            HYPOTHESIS_STORAGE_DIRECTORY = Join-Path $env:RUNNER_TEMP "hypothesis"
            MYPY_CACHE_DIR = Join-Path $env:RUNNER_TEMP "mypy-cache"
            RUFF_CACHE_DIR = Join-Path $env:RUNNER_TEMP "ruff-cache"
          }
          foreach ($item in $externalState.GetEnumerator()) {
            Add-Content -Path $env:GITHUB_ENV -Value "$($item.Key)=$($item.Value)" -Encoding utf8
          }

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Build distributions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $rawDist = Join-Path $env:RUNNER_TEMP "raw-dist"
          $dist = Join-Path $env:RUNNER_TEMP "dist"
          uv build --out-dir $rawDist --no-create-gitignore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $rawDist -Filter "*.whl")
          $sdists = @(Get-ChildItem -LiteralPath $rawDist -Filter "*.tar.gz")
          if ($wheels.Count -ne 1) { throw "expected exactly one built wheel" }
          if ($sdists.Count -ne 1) { throw "expected exactly one built sdist" }
          New-Item -ItemType Directory -Path $dist | Out-Null
          $canonicalWheel = Join-Path $dist $wheels[0].Name
          uv run --frozen python -B scripts/normalize_wheel.py $wheels[0].FullName `
            --output $canonicalWheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -LiteralPath $sdists[0].FullName -Destination $dist

      - name: Smoke-test built wheel and sdist
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-NativeSuccess {
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $dist = Join-Path $env:RUNNER_TEMP "dist"
          $wheels = @(Get-ChildItem -LiteralPath $dist -Filter "*.whl")
          $sdists = @(Get-ChildItem -LiteralPath $dist -Filter "*.tar.gz")
          if ($wheels.Count -ne 1) { throw "expected exactly one built wheel" }
          if ($sdists.Count -ne 1) { throw "expected exactly one built sdist" }

          function Test-Distribution {
            param(
              [System.IO.FileInfo] $Artifact,
              [string] $Label
            )
            $smokeEnv = Join-Path $env:RUNNER_TEMP "normshift-$Label-smoke"
            uv venv $smokeEnv --python 3.12
            Assert-NativeSuccess
            if ($env:RUNNER_OS -eq "Windows") {
              $python = Join-Path $smokeEnv "Scripts/python.exe"
              $entry = Join-Path $smokeEnv "Scripts/normshift.exe"
            } else {
              $python = Join-Path $smokeEnv "bin/python"
              $entry = Join-Path $smokeEnv "bin/normshift"
            }
            uv pip install --python $python $Artifact.FullName
            Assert-NativeSuccess
            uv pip check --python $python
            Assert-NativeSuccess

            Push-Location $env:RUNNER_TEMP
            try {
              @'
          from importlib.metadata import entry_points, version
          from importlib.resources import files

          import normshift

          assert version("normshift") == normshift.__version__
          scripts = {item.name: item.value for item in entry_points(group="console_scripts")}
          assert scripts.get("normshift") == "normshift.cli:app"
          schemas = files("normshift.schemas")
          for name in (
              "change.schema.json",
              "report.schema.json",
              "requirement.schema.json",
              "package_manifest_v1.schema.json",
              "command_log_v1.schema.json",
              "m1_source_manifest_v1.schema.json",
              "definition_transitions_v1.schema.json",
              "definition_reference_candidates_v1.schema.json",
              "lineage_graph_v1.schema.json",
          ):
              assert schemas.joinpath(name).is_file(), name
          print(f"normshift={version('normshift')} module={normshift.__file__}")
          '@ | & $python -
              Assert-NativeSuccess
              & $entry --version
              Assert-NativeSuccess
              & $entry --help
              Assert-NativeSuccess
            } finally {
              Pop-Location
            }
          }

          Test-Distribution -Artifact $wheels[0] -Label "wheel"
          Test-Distribution -Artifact $sdists[0] -Label "sdist"

      - name: Test with no non-pass outcomes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $junit = Join-Path $env:RUNNER_TEMP "pytest.xml"
          $terminal = Join-Path $env:RUNNER_TEMP "pytest.log"
          uv run pytest -q -ra --color=no -p no:cacheprovider "--junitxml=$junit" 2>&1 |
            Tee-Object -FilePath $terminal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:NORMSHIFT_CI_JUNIT = $junit
          $env:NORMSHIFT_CI_PYTEST_LOG = $terminal
          @'
          import os
          from pathlib import Path

          from normshift.audit.package_build import _parse_junit, _require_clean_pytest

          junit = Path(os.environ["NORMSHIFT_CI_JUNIT"])
          terminal = Path(os.environ["NORMSHIFT_CI_PYTEST_LOG"]).read_text(
              encoding="utf-8", errors="replace"
          )
          summary = _parse_junit(junit, terminal)
          _require_clean_pytest(summary, "cross-platform CI")
          print(summary.counts)
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M0 R4 and R5 regression matrices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $junit = Join-Path $env:RUNNER_TEMP "m0-r4-r5.xml"
          $terminal = Join-Path $env:RUNNER_TEMP "m0-r4-r5.log"
          uv run pytest -q -ra --color=no -p no:cacheprovider "--junitxml=$junit" `
            tests/e2e/test_m0_repair_round4.py `
            tests/e2e/test_m0_repair_round5.py 2>&1 | Tee-Object -FilePath $terminal
          $pytestExit = $LASTEXITCODE
          if ($pytestExit -ne 0) { exit $pytestExit }

          $env:NORMSHIFT_CI_JUNIT = $junit
          $env:NORMSHIFT_CI_PYTEST_LOG = $terminal
          @'
          import os
          from pathlib import Path

          from normshift.audit.package_build import _parse_junit, _require_clean_pytest

          junit = Path(os.environ["NORMSHIFT_CI_JUNIT"])
          terminal = Path(os.environ["NORMSHIFT_CI_PYTEST_LOG"]).read_text(
              encoding="utf-8", errors="replace"
          )
          summary = _parse_junit(junit, terminal)
          _require_clean_pytest(summary, "M0 R4/R5")
          print(summary.counts)
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M1 development source recipes (network-free only)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          uv run normshift corpus verify-recipe-evidence corpus/m1-development `
            --inventory-sha256 0eb3e50d0c35eb091b181f8cfe2007cc88b6496d38147870570e0219d92b5938 `
            --manifest-sha256 a2cfd4efa43fc2e90a76ded6e6c461bbf42ccd445cd674009cc083faa7102aaf `
            --acceptance-policy acceptance/m1_m2_prereg_v1.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M0 benchmark
        shell: pwsh
        run: |
          $terminal = Join-Path $env:RUNNER_TEMP "m0-benchmark.log"
          uv run normshift benchmark --ground-truth benchmark/ground_truth.jsonl 2>&1 |
            Tee-Object -FilePath $terminal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: M0 deterministic evidence replay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-NativeSuccess {
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          $evidenceRoot = Join-Path $env:RUNNER_TEMP "normshift-m0"
          foreach ($run in @("run1", "run2")) {
            $evidenceDir = Join-Path $evidenceRoot $run
            New-Item -ItemType Directory -Force -Path $evidenceDir | Out-Null
            $metrics = Join-Path $evidenceDir "metrics.json"
            $reportJson = Join-Path $evidenceDir "report.json"
            $reportMarkdown = Join-Path $evidenceDir "report.md"

            uv run normshift measure `
              --ground-truth benchmark/measure_suite.jsonl `
              --out $metrics
            Assert-NativeSuccess
            uv run normshift diff `
              fixtures/synthetic/spec-v1.html `
              fixtures/synthetic/spec-v2.html `
              --source-root . `
              --profile rfc2119 `
              --json $reportJson `
              --markdown $reportMarkdown
            Assert-NativeSuccess
            uv run normshift verify $reportJson --source-root .
            Assert-NativeSuccess
          }

          $env:NORMSHIFT_CI_EVIDENCE = $evidenceRoot
          @'
          import os
          from hashlib import sha256
          from pathlib import Path

          root = Path(os.environ["NORMSHIFT_CI_EVIDENCE"])
          for name in ("metrics.json", "report.json", "report.md"):
              left = (root / "run1" / name).read_bytes()
              right = (root / "run2" / name).read_bytes()
              assert left == right, f"non-deterministic output: {name}"
              print(f"{name} sha256={sha256(left).hexdigest()}")
          '@ | uv run python -
          Assert-NativeSuccess

      - name: Export frozen CycloneDX SBOM
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sbom = Join-Path $env:RUNNER_TEMP "normshift-sbom.cdx.json"
          uv export --preview-features sbom-export --frozen --no-dev --no-editable `
            --format cyclonedx1.5 --output-file $sbom
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NORMSHIFT_CI_SBOM = $sbom
          @'
          import json
          import os
          import tomllib
          from pathlib import Path

          from cyclonedx.schema import SchemaVersion
          from cyclonedx.validation.json import JsonStrictValidator

          sbom = Path(os.environ["NORMSHIFT_CI_SBOM"])
          raw = sbom.read_text(encoding="utf-8")
          assert JsonStrictValidator(SchemaVersion.V1_5).validate_str(raw) is None
          payload = json.loads(raw)
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          root = payload["metadata"]["component"]
          assert payload["bomFormat"] == "CycloneDX"
          assert payload["specVersion"] == "1.5"
          assert (root["name"], root["version"]) == (project["name"], project["version"])
          assert payload["components"]
          assert payload["dependencies"]
          print(f"components={len(payload['components'])} dependencies={len(payload['dependencies'])}")
          '@ | uv run python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Confirm exact checkout stayed clean
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $state = @(git status --porcelain=v1 --untracked-files=all --ignored)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($state.Count -ne 0) {
            $state | ForEach-Object { Write-Error $_ }
            throw "CI gates left tracked, untracked, or ignored state in the checkout"
          }

      - name: Retain cross-platform review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m0-ci-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/dist/*
            ${{ runner.temp }}/pytest.xml
            ${{ runner.temp }}/pytest.log
            ${{ runner.temp }}/m0-r4-r5.xml
            ${{ runner.temp }}/m0-r4-r5.log
            ${{ runner.temp }}/m0-benchmark.log
            ${{ runner.temp }}/normshift-m0/**
            ${{ runner.temp }}/normshift-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 90

  cross-platform-distribution-equality:
    name: cross-platform distribution byte equality
    needs: deterministic-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: false

      - name: Download exact-run distribution evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: m0-ci-*-${{ github.sha }}
          path: ${{ runner.temp }}/cross-platform-artifacts

      - name: Require byte-identical wheel and sdist across all runners
        shell: pwsh
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "cross-platform-artifacts"
          $wheels = @(Get-ChildItem -LiteralPath $root -Recurse -Filter "*.whl")
          $sdists = @(Get-ChildItem -LiteralPath $root -Recurse -Filter "*.tar.gz")
          if ($wheels.Count -ne 3) { throw "expected one wheel from each of three runners" }
          if ($sdists.Count -ne 3) { throw "expected one sdist from each of three runners" }
          if (@($wheels.Name | Sort-Object -Unique).Count -ne 1) {
            throw "runner wheel names differ"
          }
          if (@($sdists.Name | Sort-Object -Unique).Count -ne 1) {
            throw "runner sdist names differ"
          }
          foreach ($wheel in $wheels) {
            uv run --no-project --python 3.12 python -B scripts/normalize_wheel.py `
              --check $wheel.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $wheelHashes = @(
            $wheels | ForEach-Object {
              (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            } | Sort-Object -Unique
          )
          $sdistHashes = @(
            $sdists | ForEach-Object {
              (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            } | Sort-Object -Unique
          )
          if ($wheelHashes.Count -ne 1) { throw "runner wheel bytes differ: $wheelHashes" }
          if ($sdistHashes.Count -ne 1) { throw "runner sdist bytes differ: $sdistHashes" }
          Write-Output "wheel sha256=$($wheelHashes[0])"
          Write-Output "sdist sha256=$($sdistHashes[0])"
